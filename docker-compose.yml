services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-proyecto
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      - ORACLE_PASSWORD=Admin1234
      - APP_USER=proyecto_usr
      - APP_USER_PASSWORD=Proyecto1234
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./db/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s proyecto_usr/Proyecto1234@//localhost:1521/XEPDB1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

volumes:
  oracle-data:
